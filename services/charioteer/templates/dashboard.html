<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Charioteer Dashboard</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e1e;
            color: #d4d4d4;
        }

        .dashboard-container {
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .dashboard-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .dashboard-header h1 {
            color: #569cd6;
            margin: 0;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .metric-card {
            background: #2d2d30;
            border: 1px solid #3e3e42;
            border-radius: 8px;
            padding: 20px;
        }

        .metric-card h3 {
            margin: 0 0 15px 0;
            color: #569cd6;
            font-size: 18px;
        }

        .metric-value {
            font-size: 24px;
            font-weight: bold;
            color: #4ec9b0;
            margin-bottom: 10px;
        }

        .metric-label {
            color: #cccccc;
            font-size: 14px;
        }

        .sessions-table {
            background: #2d2d30;
            border: 1px solid #3e3e42;
            border-radius: 8px;
            overflow: hidden;
        }

        .sessions-table h3 {
            margin: 0;
            padding: 20px;
            background: #383838;
            color: #569cd6;
        }

        .table-container {
            max-height: 400px;
            overflow-y: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #3e3e42;
        }

        th {
            background: #383838;
            color: #cccccc;
            font-weight: 600;
        }

        td {
            color: #d4d4d4;
        }

        .status-active {
            color: #4ec9b0;
        }

        .status-expired {
            color: #f48771;
        }

        .refresh-button {
            background: #0e639c;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .refresh-button:hover {
            background: #1177bb;
        }

        .error-message {
            background: #5a1d1d;
            border: 1px solid #be1100;
            color: #f48771;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
        }

        .loading {
            text-align: center;
            color: #569cd6;
            font-size: 18px;
            margin: 40px 0;
        }
    </style>
</head>

<body>
    <div class="dashboard-container">
        <div class="dashboard-header">
            <button class="refresh-button" onclick="refreshDashboard()">🔄 Refresh</button>
        </div>

        <div id="errorMessage" class="error-message" style="display: none;"></div>
        <div id="loading" class="loading">Loading dashboard data...</div>

        <div id="dashboardContent" style="display: none;">
            <div class="metrics-grid">
                <div class="metric-card">
                    <h3>Active Sessions</h3>
                    <div class="metric-value" id="activeSessions">-</div>
                    <div class="metric-label">Currently logged in users</div>
                </div>
                <div class="metric-card">
                    <h3>Total Sessions</h3>
                    <div class="metric-value" id="totalSessions">-</div>
                    <div class="metric-label">All sessions (active + expired)</div>
                </div>
                <div class="metric-card">
                    <h3>Server Uptime</h3>
                    <div class="metric-value" id="uptime">-</div>
                    <div class="metric-label">Since last restart</div>
                </div>
                <div class="metric-card">
                    <h3>System Status</h3>
                    <div class="metric-value" id="systemStatus">-</div>
                    <div class="metric-label">Current system state</div>
                </div>
            </div>

            <div class="sessions-table">
                <h3>Active Sessions</h3>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Username</th>
                                <th>Session ID</th>
                                <th>Created</th>
                                <th>Last Access</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="sessionsTableBody">
                            <tr>
                                <td colspan="5" style="text-align: center;">Loading sessions...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const BACKEND_URL = '{{.BackendURL}}';
        let refreshInterval;
        let authToken = null;

        // Extract token from URL parameter
        function getTokenFromURL() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('token');
        }

        // Initialize auth token
        authToken = getTokenFromURL();

        async function fetchDashboardData() {
            try {
                const headers = {
                    'Content-Type': 'application/json'
                };

                // Add authorization header if we have a token
                if (authToken) {
                    headers['Authorization'] = authToken;
                }

                const response = await fetch('/charioteer/api/dashboard/status', {
                    method: 'GET',
                    headers: headers
                });

                if (!response.ok) {
                    throw new Error('Failed to fetch dashboard data: ' + response.statusText);
                }

                const result = await response.json();
                if (result.result !== 'OK') {
                    throw new Error('Dashboard API error: ' + (result.data || 'Unknown error'));
                }

                return result.data;
            } catch (error) {
                console.error('Error fetching dashboard data:', error);
                throw error;
            }
        }

        function updateDashboard(data) {
            // Update metrics
            document.getElementById('activeSessions').textContent = data.activeSessions || 0;
            document.getElementById('totalSessions').textContent = data.totalSessions || 0;
            document.getElementById('uptime').textContent = data.uptime || 'Unknown';
            document.getElementById('systemStatus').textContent = data.systemStatus || 'Unknown';

            // Update sessions table
            const tbody = document.getElementById('sessionsTableBody');
            tbody.innerHTML = '';

            if (data.sessions && data.sessions.length > 0) {
                data.sessions.forEach(session => {
                    const row = document.createElement('tr');
                    row.innerHTML = '<td>' + escapeHtml(session.username || 'Unknown') + '</td>' +
                        '<td>' + escapeHtml(session.sessionId ? session.sessionId.substring(0, 8) + '...' : 'Unknown') + '</td>' +
                        '<td>' + escapeHtml(session.created || 'Unknown') + '</td>' +
                        '<td>' + escapeHtml(session.lastAccess || 'Unknown') + '</td>' +
                        '<td class="' + (session.active ? 'status-active' : 'status-expired') + '">' +
                        (session.active ? 'Active' : 'Expired') + '</td>';
                    tbody.appendChild(row);
                });
            } else {
                const row = document.createElement('tr');
                row.innerHTML = '<td colspan="5" style="text-align: center;">No sessions found</td>';
                tbody.appendChild(row);
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            document.getElementById('loading').style.display = 'none';
            document.getElementById('dashboardContent').style.display = 'none';
        }

        function hideError() {
            document.getElementById('errorMessage').style.display = 'none';
        }

        async function refreshDashboard() {
            try {
                hideError();
                document.getElementById('loading').style.display = 'block';
                document.getElementById('dashboardContent').style.display = 'none';

                const data = await fetchDashboardData();
                updateDashboard(data);

                document.getElementById('loading').style.display = 'none';
                document.getElementById('dashboardContent').style.display = 'block';
            } catch (error) {
                showError('Failed to load dashboard data: ' + error.message);
            }
        }

        // Initialize dashboard
        document.addEventListener('DOMContentLoaded', function () {
            refreshDashboard();
            // Refresh every 30 seconds
            refreshInterval = setInterval(refreshDashboard, 30000);
        });

        // Cleanup interval when page unloads
        window.addEventListener('beforeunload', function () {
            if (refreshInterval) {
                clearInterval(refreshInterval);
            }
        });
    </script>
</body>

</html>
