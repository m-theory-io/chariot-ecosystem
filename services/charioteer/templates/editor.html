<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Charioteer Code Editor</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            overflow: hidden;
        }

        // Tabs for switching toolbar modes
        .toolbar-tabs {
            display: flex;
            gap: 4px;
            margin-right: 8px;
        }

        .toolbar-tab {
            background: #232326;
            color: #ccc;
            border: none;
            border-radius: 3px 3px 0 0;
            padding: 6px 18px 4px 18px;
            font-size: 14px;
            cursor: pointer;
            outline: none;
            border-bottom: 2px solid transparent;
            transition: background 0.15s, color 0.15s;
        }

        .toolbar-tab.active {
            background: #1e1e1e;
            color: #fff;
            border-bottom: 2px solid #007acc;
            font-weight: bold;
        }

        .toolbar-section {
            display: none;
        }

        .toolbar-section.active {
            display: flex;
        }

        .toolbar {
            background-color: #2d2d30;
            color: white;
            padding: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            height: 50px;
            box-sizing: border-box;
            flex-shrink: 0;
            min-width: 0;
            /* Allow flexbox shrinking */
            overflow: hidden;
            /* Hide overflow instead of wrapping */
        }

        .file-selector {
            display: flex;
            align-items: center;
            gap: 8px;
            /* Even spacing between label and select */
            margin-left: 0;
            /* Remove any left margin */
            min-width: 0;
            padding-left: 0;
            /* Remove any left padding */
        }

        .file-selector label {
            font-size: 14px;
            white-space: nowrap;
            min-width: 40px;
            /* Optional: keep label width consistent */
            margin-right: 0;
            /* Remove any right margin */
        }

        .file-scope-controls,
        .diagram-scope-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-left: 0;
            margin-right: 8px;
        }

        .file-scope-controls label,
        .diagram-scope-controls label {
            font-size: 14px;
            white-space: nowrap;
        }

        .file-scope-controls select,
        .diagram-scope-controls select {
            background-color: #3c3c3c;
            color: white;
            border: 1px solid #555;
            border-radius: 3px;
            padding: 5px 10px;
            font-size: 14px;
            min-width: 120px;
        }

        .file-selector select {
            background-color: #3c3c3c;
            color: white;
            border: 1px solid #555;
            border-radius: 3px;
            padding: 5px 10px;
            font-size: 14px;
            min-width: 150px;
            max-width: 200px;
            flex-shrink: 1;
            margin-right: 12px;
            /* Add space to the right of the dropdown */
        }

        .save-buttons {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
            /* Don't shrink save buttons */
        }

        .toolbar-button {
            background-color: #4a4a4a;
            color: white;
            border: none;
            border-radius: 3px;
            padding: 6px 12px;
            font-size: 13px;
            cursor: pointer;
        }

        .toolbar-button:hover:not(:disabled) {
            background-color: #5a5a5a;
        }

        .toolbar-button:disabled {
            background-color: #3a3a3a;
            color: #888;
            cursor: not-allowed;
        }

        .auth-section {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-left: auto;
            flex-shrink: 0;
            min-width: 0;
            /* Allow flexbox shrinking */
        }

        #functionsToolbar {
            align-items: center;
            gap: 8px;
            margin-left: 16px;
        }

        #functionSelect {
            background-color: #3c3c3c;
            color: white;
            border: 1px solid #555;
            border-radius: 3px;
            padding: 5px 10px;
            font-size: 14px;
            min-width: 150px;
            max-width: 200px;
            flex-shrink: 1;
            margin-right: 12px;
            /* Space before first button */
        }

        #loginSection {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: nowrap;
        }

        #loggedInSection {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: nowrap;
            min-width: 0;
            /* Allow flexbox shrinking */
        }

        .auth-input {
            background-color: #3c3c3c;
            color: white;
            border: 1px solid #555;
            border-radius: 3px;
            padding: 5px 8px;
            font-size: 13px;
            width: 100px;
            /* Reduced from 120px */
            min-width: 80px;
            /* Minimum width */
            flex-shrink: 1;
            /* Allow shrinking */
        }

        .auth-button {
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 3px;
            padding: 6px 12px;
            font-size: 13px;
            cursor: pointer;
            flex-shrink: 0;
            /* Don't shrink buttons */
            white-space: nowrap;
        }

        .auth-button.logout {
            background-color: #dc3545;
        }

        .user-info {
            color: #4ec9b0;
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 150px;
            /* Limit width to prevent overflow */
            flex-shrink: 1;
            /* Allow shrinking */
        }

        /* Session expiration warning modal */
        .session-warning-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .session-warning-dialog {
            background-color: #2d2d30;
            color: #d4d4d4;
            border: 2px solid #007acc;
            border-radius: 8px;
            padding: 24px;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            animation: modalSlideIn 0.3s ease-out;
        }

        @keyframes modalSlideIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .session-warning-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #f0ad4e;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .session-warning-message {
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 20px;
            color: #cccccc;
        }

        .session-warning-countdown {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #f0ad4e;
            text-align: center;
            padding: 8px;
            background-color: rgba(240, 173, 78, 0.1);
            border-radius: 4px;
        }

        .session-warning-buttons {
            display: flex;
            justify-content: space-between;
            gap: 12px;
        }

        .session-warning-button {
            flex: 1;
            padding: 10px 16px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .session-warning-button.extend {
            background-color: #28a745;
            color: white;
        }

        .session-warning-button.extend:hover {
            background-color: #218838;
        }

        .session-warning-button.logout {
            background-color: #dc3545;
            color: white;
        }

        .session-warning-button.logout:hover {
            background-color: #c82333;
        }

        .run-button {
            background-color: #007acc;
            color: white;
            border: none;
            border-radius: 3px;
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
        }

        .run-button:disabled {
            background-color: #555;
            cursor: not-allowed;
        }

        .left-panel {
            width: 260px;
            background: #232326;
            color: #d4d4d4;
            border-right: 1px solid #333;
            padding: 0;
            overflow-y: auto;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            min-width: 200px;
            /* Minimum width for resizing */
            max-width: 600px;
            /* Maximum width for resizing */
        }

        /* Add left panel splitter styles */
        .left-splitter {
            width: 4px;
            background-color: #3c3c3c;
            cursor: col-resize;
            flex-shrink: 0;
        }

        .left-splitter:hover {
            background-color: #007acc;
        }

        .left-panel div[style*="font-weight:bold"] {
            font-size: 13px !important;
            color: #f5f5f5 !important;
            /* ivory/white */
            font-weight: 500 !important;
            margin-bottom: 2px !important;
            letter-spacing: 0.5px;
        }

        /* Debugger panel styles */
        .debug-panel {
            padding: 10px;
            flex: 1;
            overflow-y: auto;
        }

        .debug-section {
            margin-bottom: 15px;
            background: #2d2d30;
            border-radius: 4px;
            overflow: hidden;
        }

        .debug-section-header {
            background: #3c3c3c;
            padding: 8px 10px;
            font-weight: bold;
            font-size: 13px;
            color: #f0f0f0;
            cursor: pointer;
            user-select: none;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .debug-section-header:hover {
            background: #454545;
        }

        .debug-section-header::before {
            content: '▼';
            font-size: 10px;
            transition: transform 0.2s;
        }

        .debug-section-header.collapsed::before {
            transform: rotate(-90deg);
        }

        .debug-section-content {
            padding: 8px;
            max-height: 300px;
            overflow-y: auto;
        }

        .debug-section-content.collapsed {
            display: none;
        }

        .debug-controls {
            display: flex;
            gap: 6px;
            padding: 10px;
            background: #2d2d30;
            border-bottom: 1px solid #3c3c3c;
        }

        .debug-button {
            background: #4a4a4a;
            color: white;
            border: none;
            border-radius: 3px;
            padding: 6px 12px;
            font-size: 12px;
            cursor: pointer;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .debug-button:hover:not(:disabled) {
            background: #5a5a5a;
        }

        .debug-button:disabled {
            background: #3a3a3a;
            color: #888;
            cursor: not-allowed;
        }

        .debug-button.play {
            background: #28a745;
        }

        .debug-button.play:hover:not(:disabled) {
            background: #218838;
        }

        .debug-button.pause {
            background: #ffc107;
            color: #000;
        }

        .debug-button.pause:hover:not(:disabled) {
            background: #e0a800;
        }

        .breakpoint-item,
        .callstack-item,
        .variable-item {
            padding: 6px 8px;
            font-size: 12px;
            font-family: 'Consolas', 'Monaco', monospace;
            border-bottom: 1px solid #3c3c3c;
            cursor: pointer;
        }

        .breakpoint-item:hover,
        .callstack-item:hover {
            background: #3c3c3c;
        }

        .breakpoint-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .breakpoint-location {
            color: #9cdcfe;
        }

        .breakpoint-line {
            color: #ce9178;
            font-size: 11px;
        }

        .breakpoint-remove {
            color: #f48771;
            cursor: pointer;
            font-size: 14px;
            padding: 0 4px;
        }

        .breakpoint-remove:hover {
            color: #ff6b6b;
        }

        .callstack-function {
            color: #dcdcaa;
            font-weight: bold;
        }

        .callstack-location {
            color: #9cdcfe;
            font-size: 11px;
        }

        .variable-item {
            display: flex;
            justify-content: space-between;
            cursor: default;
        }

        .variable-name {
            color: #9cdcfe;
            font-weight: bold;
        }

        .variable-value {
            color: #ce9178;
        }

        .debug-status {
            padding: 8px 10px;
            background: #2d2d30;
            border-bottom: 1px solid #3c3c3c;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .debug-status-icon {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #888;
        }

        .debug-status-icon.running {
            background: #28a745;
        }

        .debug-status-icon.paused {
            background: #ffc107;
        }

        .debug-status-icon.stepping {
            background: #17a2b8;
        }

        .debug-status-icon.stopped {
            background: #dc3545;
        }

        /* Monaco editor breakpoint decorations */
        .breakpoint-line {
            background: rgba(255, 0, 0, 0.15) !important;
        }

        .breakpoint-glyph {
            background: #e51400 !important;
            border-radius: 50%;
            width: 10px !important;
            height: 10px !important;
            margin-left: 3px;
        }

        .debug-current-line {
            background: rgba(255, 255, 0, 0.2) !important;
        }

        .debug-current-glyph {
            width: 0 !important;
            height: 0 !important;
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-bottom: 10px solid #ffff00;
            margin-left: 2px;
        }

        .main-container {
            display: flex;
            flex-direction: row;
            height: 100vh;
            position: relative;
            min-height: 0;
        }

        .center-panel {
            display: flex;
            flex-direction: column;
            flex: 1 1 0%;
            min-width: 0;
            min-height: 0;
        }

        .editor-container {
            flex: 1 1 0%;
            min-width: 0;
            min-height: 0;
            background-color: #1e1e1e;
            position: relative;
        }

        .editor-workspace {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: row;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .editor-pane {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            background: #1e1e1e;
        }

        .editor-pane.secondary {
            display: none;
        }

        .editor-pane.visible {
            display: flex;
        }

        .pane-divider {
            width: 4px;
            background: #2d2d30;
            cursor: col-resize;
            display: none;
        }

        .pane-divider.visible {
            display: block;
        }

        .pane-tab-strip {
            display: flex;
            align-items: center;
            height: 36px;
            background: #2a2a2d;
            border-bottom: 1px solid #1b1b1f;
            overflow-x: auto;
            overflow-y: hidden;
            padding: 0 8px;
            gap: 6px;
        }

        .pane-tab-strip::-webkit-scrollbar {
            height: 6px;
        }

        .pane-tab-strip::-webkit-scrollbar-thumb {
            background: #3d3d42;
            border-radius: 3px;
        }

        .editor-tab {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 5px 10px;
            background: #3a3a3f;
            color: #d4d4d4;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
            user-select: none;
            border: 1px solid transparent;
        }

        .editor-tab.active {
            background: #1e1e1e;
            border-color: #007acc;
            color: #fff;
        }

        .editor-tab.unsaved::after {
            content: '●';
            font-size: 9px;
            color: #f6be4f;
        }

        .editor-tab button {
            border: none;
            background: transparent;
            color: inherit;
            cursor: pointer;
            font-size: 12px;
            padding: 0;
        }

        .pane-editor-shell {
            flex: 1;
            min-height: 0;
            position: relative;
        }

        .pane-editor {
            position: absolute;
            inset: 0;
        }

        .pane-empty-state {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #6f6f76;
            font-size: 14px;
            flex: 1;
        }

        .split-drop-hint {
            position: absolute;
            left: 5%;
            right: 5%;
            bottom: 20px;
            height: 60px;
            border: 2px dashed #007acc;
            border-radius: 6px;
            color: #9cdcfe;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 122, 204, 0.1);
            font-size: 13px;
            pointer-events: none;
        }

        .splitter {
            height: 4px;
            background-color: #3c3c3c;
            cursor: row-resize;
            flex-shrink: 0;
        }

        .splitter:hover {
            background-color: #007acc;
        }

        .bottom-panel {
            background-color: #252526;
            border-top: 1px solid #3c3c3c;
            height: 250px;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .tab-bar {
            background-color: #2d2d30;
            display: flex;
            align-items: center;
            height: 35px;
            border-bottom: 1px solid #3c3c3c;
            flex-shrink: 0;
        }

        .tab {
            background-color: #2d2d30;
            color: #ccc;
            border: none;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 13px;
            border-right: 1px solid #3c3c3c;
        }

        .tab.active {
            background-color: #1e1e1e;
            color: white;
        }

        .tab-content {
            flex: 1;
            padding: 10px;
            overflow-y: auto;
            background-color: #1e1e1e;
            color: #d4d4d4;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 13px;
            white-space: pre-wrap;
        }

        /* Tree viewer styles */
        .left-panel .tree-view {
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 13px;
            line-height: 1.5;
            padding: 10px;
            user-select: text;
        }

        .tree-key {
            color: #4ec9b0;
            cursor: pointer;
        }

        .tree-toggle {
            cursor: pointer;
            color: #ffd700;
            margin-right: 4px;
            font-weight: bold;
        }

        .tree-collapsed>.tree-children {
            display: none;
        }

        .tree-leaf {
            color: #d4d4d4;
        }

        .tree-node-type {
            color: #ffb86c;
            font-style: italic;
        }

        .tree-function {
            color: #ffb86c;
            cursor: pointer;
            text-decoration: underline;
        }

        .tree-function:hover {
            color: #ffd700;
        }

        .output-success {
            color: #4ec9b0;
        }

        .output-error {
            color: #f44747;
        }

        .output-info {
            color: #569cd6;
        }

        .loading {
            color: #ffcc02;
        }

        /* Enhanced bracket highlighting */
        .monaco-editor .bracket-match {
            background-color: rgba(0, 122, 204, 0.3) !important;
            border: 1px solid #007acc !important;
            border-radius: 2px !important;
        }

        .monaco-editor .bracket-highlight {
            background-color: rgba(0, 122, 204, 0.2) !important;
            box-shadow: 0 0 0 1px rgba(0, 122, 204, 0.6) !important;
            border-radius: 2px !important;
        }

        /* Bracket pair colorization */
        .monaco-editor .bracket-highlighting-0 {
            color: #FFD700 !important;
        }

        .monaco-editor .bracket-highlighting-1 {
            color: #DA70D6 !important;
        }

        .monaco-editor .bracket-highlighting-2 {
            color: #87CEEB !important;
        }

        .monaco-editor .bracket-highlighting-3 {
            color: #98FB98 !important;
        }

        .monaco-editor .bracket-highlighting-4 {
            color: #F0E68C !important;
        }

        .monaco-editor .bracket-highlighting-5 {
            color: #FF6347 !important;
        }

        /* Bracket guides */
        .monaco-editor .bracket-pair-guide {
            border-left: 1px solid rgba(0, 122, 204, 0.3) !important;
        }

        .monaco-editor .bracket-pair-guide.active {
            border-left: 1px solid rgba(0, 122, 204, 0.8) !important;
        }

        /* Chariot syntax highlighting colors for Monaco editor */
        .monaco-editor .token.keyword.control.chariot {
            color: #c586c0 !important;
        }

        .monaco-editor .token.keyword.chariot.array {
            color: #4fc1ff !important;
        }

        .monaco-editor .token.keyword.chariot.bdi {
            color: #4fc1ff !important;
        }

        .monaco-editor .token.keyword.chariot.comparison {
            color: #ffd700 !important;
        }

        .monaco-editor .token.keyword.chariot.couchbase {
            color: #ff6b6b !important;
        }

        .monaco-editor .token.keyword.chariot.crypto {
            color: #FF6B6B !important;
        }

        .monaco-editor .token.keyword.chariot.date {
            color: #4ecdc4 !important;
        }

        .monaco-editor .token.keyword.chariot.dispatcher {
            color: #95e1d3 !important;
        }

        .monaco-editor .token.keyword.chariot.etl {
            color: #a8e6cf !important;
        }

        .monaco-editor .token.keyword.chariot.file {
            color: #ffd3a5 !important;
        }

        .monaco-editor .token.keyword.chariot.flow {
            color: #c586c0 !important;
        }

        .monaco-editor .token.keyword.chariot.host {
            color: #fd79a8 !important;
        }

        .monaco-editor .token.keyword.chariot.json {
            color: #fdcb6e !important;
        }

        .monaco-editor .token.keyword.chariot.math {
            color: #6c5ce7 !important;
        }

        .monaco-editor .token.keyword.chariot.knapsack {
            color: #a29bfe !important;
        }

        .monaco-editor .token.keyword.chariot.rl {
            color: #a29bfe !important;
        }

        .monaco-editor .token.keyword.chariot.node {
            color: #a29bfe !important;
        }

        .monaco-editor .token.keyword.chariot.csv {
            color: #fdcb6e !important;
        }

        .monaco-editor .token.keyword.chariot.sql {
            color: #fd79a8 !important;
        }

        .monaco-editor .token.keyword.chariot.string {
            color: #00b894 !important;
        }

        .monaco-editor .token.keyword.chariot.system {
            color: #e17055 !important;
        }

        .monaco-editor .token.keyword.chariot.value {
            color: #0984e3 !important;
        }

        .monaco-editor .token.keyword.function.user {
            color: #ffb86c !important;
        }

        /* Responsive design for narrow screens */
        @media (max-width: 1200px) {
            .toolbar {
                gap: 10px;
                /* Reduce gap */
            }

            .auth-input {
                width: 80px;
                /* Further reduce input width */
                min-width: 60px;
            }

            .file-selector select {

            }

            .user-info {
                max-width: 120px;

            }
        }

        @media (max-width: 900px) {

                gap: 8px;
                padding: 8px;
            }

            .auth-input {
                width: 70px;
                min-width: 50px;
                font-size: 12px;
                padding: 4px 6px;
            }

            .auth-button {
                padding: 4px 8px;
                font-size: 12px;

            .file-selector label {
                display: none;
                /* Hide "File:" label on very narrow screens */
            }

            .user-info {
                max-width: 100px;
                font-size: 11px;
            }
        }

        .file-action {
            margin-left: 10px;

        }

        .file-action.delete {

            /* Red background for delete */
        }

        .file-action.delete:hover:not(:disabled) {
            background-color: #c82333;
            /* Darker red on hover */
        }
    </style>

    <script src="chariot-codegen.js"></script>
    <script>
        // Configuration
        const CHARIOT_FILES_FOLDER = 'files';
        const LISTENER_SCRIPTS_API = '/charioteer/api/listener-scripts';
        const FILE_SCOPE_LISTENERS = 'listeners';
        const FUNCTION_LIBRARY_SCOPE = 'function-library';
        const SESSION_DURATION_MINUTES = 30; // 30 minutes session duration
        const WARNING_BEFORE_MINUTES = 3; // Show warning 3 minutes before expiration
        const LOGOUT_BEFORE_SECONDS = 30; // Auto-logout 30 seconds before expiration        
        // Chariot base rules
        const CHARIOT_MONARCH_BASE_RULES = [
            // Comments
            [/\/\/.*$/, 'comment'],
            [/\/\*/, 'comment', '@comment'],

            // Strings
            [/"([^"\\]|\\.)*$/, 'string.invalid'],
            [/"/, 'string', '@string'],
            [/'([^'\\]|\\.)*$/, 'string.invalid'],
            [/'/, 'string', '@string_single'],

            // Numbers
            [/\d*\.\d+([eE][-+]?\d+)?/, 'number.float'],
            [/\d+/, 'number'],

            // True keywords (special parser handling, not function calls)
            [/\belse|break|continue\b(?!\s*\()/, 'keyword.control.chariot'],

            // Special control flow constructs (create special AST nodes, not FuncCall)
            [/\b(if|while|func|switch|case|default)\b(?=\s*\()/, 'keyword.control.chariot'],

            // Chariot specific functions (only when followed by parens)
            [/\b(findUser|createUser|updateUser|deleteUser|authenticateUser|setUserPassword|generateToken|validateDisplayName)\b(?=\s*\()/, 'keyword.auth'],
            [/\b(addTo|array|lastIndex|range|removeAt|reverse|setAt|slice)\b(?=\s*\()/, 'keyword.chariot.array'],
            [/\b(agentBelief|agentNew|agentRegister|agentStart|agentStartNamed|agentStopNamed|agentList|agentPublish|agentStop|belief|plan|runPlanOnce|runPlanOnceBDI|runPlanOnceEx)\b(?=\s*\()/, 'keyword.chariot.bdi'],
            [/\b(and|bigger|biggerEq|equal|iif|not|or|unequal|smaller|smallerEq)\b(?=\s*\()/, 'keyword.chariot.comparison'],
            [/\b(cbClose|cbConnect|cbGet|cbInsert|cbOpenBucket|cbQuery|cbRemove|cbReplace|cbSetScope|cbUpsert|newID)\b(?=\s*\()/, 'keyword.chariot.couchbase'],
            [/\b(date|dateAdd|dateDiff|dateSchedule|day|dayCount|dayOfWeek|endOfMonth|formatDate|isBusinessDay|isDate|isEndOfMonth|julianDay|month|nextBusinessDay|now|today|utcTime|year|yearFraction)\b(?=\s*\()/, 'keyword.chariot.date'],
            [/\b(apply|clone|contains|getAllMeta|getAt|getAttributes|getMeta|getProp|indexOf|setMeta|setProp|length)\b(?=\s*\()/, 'keyword.chariot.dispatcher'],
            [/\b(addMapping|addMappingWithTransform|createTransform|doETL|etlStatus|getTransform|listTransforms|map|registerTransform)\b(?=\s*\()/, 'keyword.chariot.etl'],
            [/\b(deleteFile|convertJSONFileToYAML|convertYAMLFileToJSON|fileExists|getFileSize|jsonToYAML|jsonToYAMLNode|listFiles|loadCSV|loadCSVRaw|loadJSON|loadJSONRaw|loadYAML|loadYAMLMultiDoc|loadYAMLRaw|loadXML|loadXMLRaw|parseXMLString|readFile|saveCSV|saveCSVRaw|saveJSON|saveJSONRaw|saveYAML|saveYAMLMultiDoc|saveYAMLRaw|saveXML|saveXMLRaw|writeFile|yamlToJSON|yamlToJSONNode)\b(?=\s*\()/, 'keyword.chariot.file'],
            [/\b(cryptoRandomString|encrypt|decrypt|sign|verify|hash256|hash512|generateKey|generateRSAKey|randomBytes)\b(?=\s*\()/, 'keyword.chariot.crypto'],
            [/\b(break|continue)\b(?=\s*\()/, 'keyword.chariot.flow'],
            [/\b(callMethod||getHostObject|hostObject)\b(?=\s*\()/, 'keyword.chariot.host'],
            [/\b(parseJSON|parseJSONValue|toJSON|toSimpleJSON)\b(?=\s*\()/, 'keyword.chariot.json'],
            [/\b(abs|add|amortize|apr|avg|balloon|ceil|ceiling|cos|depreciation|div|dotProduct|e|exp|floor|fv|int|irr|ln|lsp|loanBalance|log|log10|log2|matmul|max|min|mod|mul|nper|npv|pct|pi|pmt|pow|pv|random|randomSeed|randomString|rate|round|sin|solveLinear|sqrt|sub|sum|tan|transpose|vectorScale)\b(?=\s*\()/, 'keyword.chariot.math'],
            [/\b(parseJSON|parseJSONValue|toJSON|toSimpleJSON)\b(?=\s*\()/, 'keyword.chariot.json'],
            [/\b(knapsack|knapsackConfig)\b(?=\s*\()/, 'keyword.chariot.knapsack'],
            [/\b(rlInit|rlScore|rlLearn|rlClose|rlSelectBest|extractRLFeatures|rlExplore|nbaDecision)\b(?=\s*\()/, 'keyword.chariot.rl'],
            [/\b(addChild|childCount|clear|cloneNode|create|csvNode|findByName|firstChild|getAttribute|getChildAt|getChildByName|getDepth|getLevel|getName|getParent|getPath|getRoot|getSiblings|getText|hasAttribute|isLeaf|isRoot|jsonNode|lastChild|list|mapNode|nodeToString|queryNode|removeAttribute|removeChild|setAttribute|setAttributes|setChildByName|setName|setText|traverseNode|xmlNode|yamlNode)\b(?=\s*\()/, 'keyword.chariot.node'],
            [/\b(csvHeaders|csvRowCount|csvColumnCount|csvGetRow|csvGetCell|csvToCSV|csvLoad)\b(?=\s*\()/, 'keyword.chariot.csv'],
            [/\b(generateCreateTable|sqlBegin|sqlConnect|sqlClose|sqlCommit|sqlExecute|sqlListTables|sqlQuery|sqlRollback)\b(?=\s*\()/, 'keyword.chariot.sql'],
            [/\b(append|ascii|atPos|char|charAt|concat|digits|format|hasPrefix|hasSuffix|interpolate|join|lastPos|lower|occurs|padLeft|padRight|repeat|replace|right|split|sprintf|string|strlen|substr|substring|trim|trimLeft|trimRight|upper)\b(?=\s*\()/, 'keyword.chariot.string'],
            [/\b(exit|getEnv|hasEnv|listen|logPrint|mcpCallTool|mcpConnect|mcpClose|mcpListTools|platform|sleep|timeFormat|timestamp)\b(?=\s*\()/, 'keyword.chariot.system'],
            [/\b(newTree|treeFind|treeGetMetadata|treeLoad|treeLoadSecure|treeSave|treeSaveSecure|treeSearch||treeToYAML|treeToXML|treeValidateSecure|treeWalk)\b(?=\s*\()/, 'keyword.chariot.tree'],
            [/\b(boolean|call|declare|declareGlobal|deleteFunction|destroy|empty|exists|func|function|getFunction|getVariable|hasMeta|inspectRuntime|isNull|isNumeric|listFunctions|loadFunctions|mapValue|merge|offerVar|offerVariable|registerFunction|saveFunctions|setValue|setq|symbol|toBool|toMapValue|toNumber|toString|typeOf|valueOf)\b(?=\s*\()/, 'keyword.chariot.value'],
            [/\bfunction\b/, 'keyword.control.chariot'], // Always highlight 'function' as a keyword
            [/[a-zA-Z_$][\w$]*/, 'identifier'],
        ];

        // Wait for DOM to be ready (and handle already-loaded state)
        (function initWhenReady() {
            const start = function () {
                try { bindAuthHandlers(); } catch (e) { console.warn('bindAuthHandlers error', e); }
                initializeEditor();
            };
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', start);
            } else {
                start();
            }
        })();

        // Pin Monaco to a specific version for stability
        require.config({ paths: { vs: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs' } });
        // Ensure auth/login handlers are attached at least once
        let authHandlersInitialized = false;
        function bindAuthHandlers() {
            if (authHandlersInitialized) return;
            const loginButton = document.getElementById('loginButton');
            const logoutButton = document.getElementById('logoutButton');
            const passwordInput = document.getElementById('passwordInput');
            if (loginButton) {
                loginButton.addEventListener('click', login);
            }
            if (logoutButton) {
                logoutButton.addEventListener('click', logout);
            }
            if (passwordInput) {
                passwordInput.addEventListener('keypress', function (e) { if (e.key === 'Enter') login(); });
            }
            authHandlersInitialized = true;
        }

        let editor;
        let functionEditorContent = '';     // Last content loaded in Function Library tab
        let functionEditorFunctionName = ''; // Last function loaded in Function Library tab
        let functionDraftCounter = 1;         // Counter for placeholder function names
        let dashboardContent = '';          // Last dashboard HTML content
        let dashboardLoaded = false;        // Track if dashboard has been loaded
        let currentFileName = '';
        let currentTab = 'output';
        let dashboardAutoRefresh = null;    // Timer for auto-refreshing dashboard when visible
        let currentBottomTab = 'output';    // Tracks the bottom panel tab (output|problems)
        // Throttle WS updates to avoid overwhelming UI
        let dashboardWSUpdateTimer = null;
        let pendingDashboardData = null;
        // Persist listener row selections across updates
        const selectedListeners = new Set();
        const listenerDetailsByName = new Map();
        let listenerScriptsCache = [];
        let listenerModalMode = 'create';
        let listenerModalEditingName = '';
        let pendingFileToLoad = null;
        let skipNextAutoFileRefresh = false;
        let fileScopePinnedByUser = false;
        let isResizing = false;
        let authToken = null;
        let sessionId = null; // Session ID for debug API calls
        let currentUser = null;
        let isFileModified = false;
        let originalContent = '';
        // Ensure toolbar handlers for Function Library are only initialized once across editor rebuilds
        let functionsToolbarInitialized = false;
        let diagramsToolbarInitialized = false;
        // Diagrams state
        let currentDiagramName = '';
        let currentDiagramJSON = null; // last loaded JSON for selected diagram
        let currentFileScope = 'global'; // Scope tied to the active editor tab
        let currentFileBrowserScope = 'global'; // Scope selected in the dropdown for browsing
        let sandboxProfile = {
            enabled: true,
            scopes: ['global', 'sandbox'],
            defaultScope: 'global',
            currentScope: 'global'
        };
        const diagramScopeState = {
            current: 'global',
            pinnedByUser: false
        };
        const editorPaneState = {
            primary: {
                id: 'primary',
                paneEl: null,
                bodyEl: null,
                tabStripEl: null,
                editor: null,
                activeTabId: null
            },
            secondary: {
                id: 'secondary',
                paneEl: null,
                bodyEl: null,
                tabStripEl: null,
                editor: null,
                activeTabId: null,
                visible: false
            }
        };
        const openFileTabs = new Map(); // tabId -> tab descriptor
        const fileKeyToTab = new Map(); // "scope::name" -> tabId
        let tabOrder = [];
        let activePaneId = 'primary';
        let splitViewActive = false;
        let untitledCounter = 1;
        let tabDragState = { tabId: null };
        let activeFileTabId = null;
        let referenceTabId = null;
        let referenceEditor = null;
        let editorContainerTemplate = '';
        const workspaceTabs = createWorkspaceTabs();
        const debugContext = createDebugContext();

        function getPaneState(paneId) {
            return editorPaneState[paneId || 'primary'];
        }

        function ensurePaneElements() {
            const container = document.getElementById('editorContainer');
            if (container && !editorContainerTemplate) {
                editorContainerTemplate = container.innerHTML;
            }
            if (container && editorContainerTemplate) {
                const primaryBody = document.getElementById('editorPanePrimaryBody');
                const secondaryBody = document.getElementById('editorPaneSecondaryBody');
                if (!primaryBody || !secondaryBody) {
                    container.innerHTML = editorContainerTemplate;
                    Object.values(editorPaneState).forEach(pane => {
                        pane.paneEl = null;
                        pane.bodyEl = null;
                        pane.tabStripEl = null;
                    });
                }
            }
            Object.values(editorPaneState).forEach(pane => {
                if (!pane.paneEl) {
                    pane.paneEl = document.getElementById('editorPane' + pane.id.charAt(0).toUpperCase() + pane.id.slice(1));
                }
                if (!pane.bodyEl) {
                    pane.bodyEl = document.getElementById('editorPane' + pane.id.charAt(0).toUpperCase() + pane.id.slice(1) + 'Body');
                }
                if (!pane.tabStripEl) {
                    pane.tabStripEl = document.getElementById('editorPane' + pane.id.charAt(0).toUpperCase() + pane.id.slice(1) + 'Tabs');
                }
            });
        }

        function getActivePaneState() {
            return getPaneState(activePaneId);
        }

        function isFunctionScope(scope) {
            return scope === FUNCTION_LIBRARY_SCOPE;
        }

        function isFunctionTab(tab) {
            return !!(tab && isFunctionScope(tab.scope));
        }

        function createWorkspaceTabs() {
            const state = {
                files: { lastTabId: null, name: '', content: '' },
                functions: { lastTabId: null, name: '', content: '' }
            };

            function bucketForTab(tab) {
                return isFunctionTab(tab) ? state.functions : state.files;
            }

            function snapshotBucket(bucket, tab) {
                if (!bucket) return;
                if (tab) {
                    bucket.lastTabId = tab.id || bucket.lastTabId;
                    bucket.name = tab.fileName || tab.displayName || bucket.name || '';
                    bucket.content = typeof tab.content === 'string' ? tab.content : bucket.content || '';
                }
            }

            function applyStandaloneSnapshot(view, payload) {
                const bucket = view === 'functions' ? state.functions : state.files;
                bucket.lastTabId = payload?.tabId || null;
                bucket.name = payload?.name || payload?.fileName || bucket.name || '';
                bucket.content = typeof payload?.content === 'string' ? payload.content : bucket.content || '';
            }

            function restoreView(view, options) {
                const bucket = view === 'functions' ? state.functions : state.files;
                const opts = options || {};
                const candidateId = bucket.lastTabId;
                if (candidateId && openFileTabs.get(candidateId)) {
                    activateFileTab(candidateId, { force: true });
                    return true;
                }
                if (opts.editor && bucket.content) {
                    opts.editor.setValue(bucket.content);
                    originalContent = bucket.content;
                    isFileModified = false;
                    if (view === 'functions') {
                        functionEditorContent = bucket.content;
                        functionEditorFunctionName = bucket.name;
                        currentFileScope = FUNCTION_LIBRARY_SCOPE;
                        const fnSelect = document.getElementById('functionSelect');
                        if (fnSelect) {
                            fnSelect.value = functionEditorFunctionName || '';
                        }
                        debugContext.remember(FUNCTION_LIBRARY_SCOPE, functionEditorFunctionName);
                    } else {
                        currentFileName = bucket.name;
                        currentFileScope = currentFileBrowserScope;
                        debugContext.remember(currentFileScope || currentFileBrowserScope, currentFileName);
                    }
                    return true;
                }
                if (typeof opts.onEmpty === 'function') {
                    opts.onEmpty();
                }
                return false;
            }

            return {
                rememberActivation(tab) {
                    if (!tab) return;
                    snapshotBucket(bucketForTab(tab), tab);
                    debugContext.rememberFromTab(tab);
                },
                rememberContent(tab) {
                    if (!tab) return;
                    const bucket = bucketForTab(tab);
                    bucket.lastTabId = tab.id;
                    bucket.name = tab.fileName || tab.displayName || bucket.name || '';
                    bucket.content = typeof tab.content === 'string' ? tab.content : bucket.content || '';
                    debugContext.rememberFromTab(tab);
                },
                rememberStandalone(view, payload) {
                    const snapshotPayload = payload || {};
                    applyStandaloneSnapshot(view, snapshotPayload);
                    debugContext.rememberStandalone(view, snapshotPayload);
                },
                restoreView,
                handleTabClosed(tabId) {
                    if (state.files.lastTabId === tabId) {
                        state.files = { lastTabId: null, name: '', content: '' };
                    }
                    if (state.functions.lastTabId === tabId) {
                        state.functions = { lastTabId: null, name: '', content: '' };
                    }
                },
                reset() {
                    state.files = { lastTabId: null, name: '', content: '' };
                    state.functions = { lastTabId: null, name: '', content: '' };
                },
                getLastFileTabId() {
                    return state.files.lastTabId;
                },
                getLastFunctionTabId() {
                    return state.functions.lastTabId;
                }
            };
        }

        function createDebugContext() {
            let lastScope = 'global';
            let lastName = 'main.ch';

            function toFilename(scope, name) {
                const normalizedScope = getNormalizedScope(scope || 'global');
                const trimmedName = (name && name.trim()) || 'main.ch';
                if (!normalizedScope || normalizedScope === 'global') {
                    return trimmedName;
                }
                return normalizedScope + '/' + trimmedName;
            }

            return {
                remember(scope, name) {
                    if (scope) {
                        lastScope = getNormalizedScope(scope);
                    }
                    if (name) {
                        lastName = name.trim();
                    }
                },
                rememberFromTab(tab) {
                    if (!tab) return;
                    const scope = isFunctionTab(tab) ? FUNCTION_LIBRARY_SCOPE : (tab.scope || lastScope);
                    const name = tab.fileName || tab.displayName || lastName;
                    this.remember(scope, name);
                },
                rememberStandalone(view, payload) {
                    if (!payload) return;
                    if (view === 'functions') {
                        this.remember(FUNCTION_LIBRARY_SCOPE, payload.name || payload.functionName || lastName);
                    } else {
                        this.remember(payload.scope || lastScope, payload.name || payload.fileName || lastName);
                    }
                },
                getFilename(options) {
                    if (options && (options.scope || options.fileName)) {
                        return toFilename(options.scope || lastScope, options.fileName || lastName);
                    }
                    return toFilename(lastScope, lastName);
                },
                toFilename
            };
        }

        function getLastFunctionTabId() {
            return workspaceTabs.getLastFunctionTabId() || findMostRecentTabId(isFunctionTab);
        }

        function getLastFileTabId() {
            return workspaceTabs.getLastFileTabId() || findMostRecentTabId(tab => tab && !isFunctionTab(tab));
        }

        function findMostRecentTabId(predicate) {
            for (let i = tabOrder.length - 1; i >= 0; i--) {
                const maybeTab = openFileTabs.get(tabOrder[i]);
                if (maybeTab && predicate(maybeTab)) {
                    return maybeTab.id;
                }
            }
            return null;
        }

        function captureFunctionEditorStateFromActiveTab() {
            if (!editor || !activeFileTabId) {
                return;
            }
            const tab = openFileTabs.get(activeFileTabId);
            if (!isFunctionTab(tab)) {
                return;
            }
            functionEditorContent = editor.getValue();
            functionEditorFunctionName = tab.fileName || '';
            tab.content = functionEditorContent;
            workspaceTabs.rememberContent(tab);
            debugContext.rememberFromTab(tab);
        }

        function getFileKey(scope, name) {
            if (!scope || !name) {
                return '';
            }
            return scope.toLowerCase() + '::' + name.toLowerCase();
        }

        function getTabById(tabId) {
            if (!tabId) return null;
            return openFileTabs.get(tabId) || null;
        }

        function getTabIdForFile(scope, name) {
            const key = getFileKey(scope, name);
            if (!key) {
                return null;
            }
            return fileKeyToTab.get(key) || null;
        }

        function indexTabByFile(tab, scope, name) {
            const key = getFileKey(scope || tab.scope, name || tab.fileName);
            if (!key) {
                return;
            }
            fileKeyToTab.set(key, tab.id);
            tab.fileKey = key;
        }

        function clearTabFileIndex(tab) {
            if (tab.fileKey) {
                fileKeyToTab.delete(tab.fileKey);
                tab.fileKey = '';
            }
        }

        function getActiveTab() {
            const pane = getActivePaneState();
            if (!pane || !pane.activeTabId) {
                return null;
            }
            return getTabById(pane.activeTabId);
        }

        function generateTabId() {
            return 'tab-' + Date.now().toString(36) + '-' + Math.random().toString(16).slice(2);
        }

        function ensureTabOrder(tabId) {
            if (!tabOrder.includes(tabId)) {
                tabOrder.push(tabId);
            }
        }

        function createTabRecord(options) {
            const opts = options || {};
            const id = opts.id || generateTabId();
            const scope = opts.scope || currentFileBrowserScope || currentFileScope || 'global';
            const fileName = (opts.fileName && opts.fileName.trim()) || '';
            return {
                id,
                scope,
                fileName,
                displayName: fileName || opts.displayName || '(untitled)',
                content: typeof opts.content === 'string' ? opts.content : '',
                originalContent: typeof opts.originalContent === 'string' ? opts.originalContent : '',
                isDirty: !!opts.isDirty,
                loaded: opts.loaded !== false,
                isUntitled: !!opts.isUntitled,
                pinnedInReference: !!opts.pinnedInReference,
                domEl: null,
                closeBtn: null
            };
        }

        function registerTab(tab) {
            openFileTabs.set(tab.id, tab);
            ensureTabOrder(tab.id);
            if (tab.fileName && !tab.isUntitled) {
                indexTabByFile(tab, tab.scope, tab.fileName);
            }
        }

        function deleteTab(tabId) {
            const tab = openFileTabs.get(tabId);
            if (!tab) return;
            if (tab.domEl && tab.domEl.parentElement) {
                tab.domEl.parentElement.removeChild(tab.domEl);
            }
            openFileTabs.delete(tabId);
            tabOrder = tabOrder.filter(id => id !== tabId);
            if (tab.fileKey) {
                fileKeyToTab.delete(tab.fileKey);
            }
            workspaceTabs.handleTabClosed(tabId);
            if (tabId === activeFileTabId) {
                activeFileTabId = null;
            }
            if (tabId === referenceTabId) {
                referenceTabId = null;
                updateReferencePane();
            }
        }

        function renderPrimaryTabs() {
            ensurePaneElements();
            const strip = editorPaneState.primary.tabStripEl;
            if (!strip) return;
            strip.innerHTML = '';
            if (tabOrder.length === 0) {
                const empty = document.createElement('div');
                empty.className = 'pane-empty-state';
                empty.textContent = 'Open a file to start editing';
                strip.appendChild(empty);
                return;
            }
            tabOrder.forEach(tabId => {
                const tab = openFileTabs.get(tabId);
                if (!tab) return;
                const el = document.createElement('div');
                el.className = 'editor-tab';
                el.textContent = tab.displayName || tab.fileName || '(untitled)';
                el.setAttribute('data-tab-id', tabId);
                el.draggable = true;
                const closeBtn = document.createElement('button');
                closeBtn.textContent = '×';
                closeBtn.title = 'Close tab';
                el.appendChild(closeBtn);
                closeBtn.addEventListener('click', (ev) => {
                    ev.stopPropagation();
                    requestTabClose(tabId);
                });
                el.addEventListener('click', () => {
                    activateFileTab(tabId);
                });
                el.addEventListener('dragstart', ev => handleTabDragStart(ev, tabId));
                el.addEventListener('dragend', handleTabDragEnd);
                strip.appendChild(el);
                tab.domEl = el;
                tab.closeBtn = closeBtn;
            });
            refreshTabVisualState();
        }

        function refreshTabVisualState() {
            tabOrder.forEach(tabId => {
                const tab = openFileTabs.get(tabId);
                if (!tab || !tab.domEl) return;
                tab.domEl.classList.toggle('active', tabId === activeFileTabId);
                tab.domEl.classList.toggle('unsaved', !!tab.isDirty);
            });
        }

        function persistActiveTabContent() {
            if (!editor) {
                return;
            }
            if (!activeFileTabId) {
                workspaceTabs.rememberStandalone(currentTab === 'functions' ? 'functions' : 'files', {
                    content: editor.getValue(),
                    name: currentTab === 'functions' ? functionEditorFunctionName : currentFileName,
                    scope: currentFileScope
                });
                return;
            }
            const tab = openFileTabs.get(activeFileTabId);
            if (!tab) {
                return;
            }
            const tabIsFunction = isFunctionTab(tab);
            const editingFunctions = currentTab === 'functions';
            const editingFiles = currentTab === 'files';
            if ((tabIsFunction && !editingFunctions) || (!tabIsFunction && !editingFiles)) {
                return;
            }
            tab.content = editor.getValue();
            tab.isDirty = tab.content !== tab.originalContent;
            workspaceTabs.rememberContent(tab);
            if (tabIsFunction) {
                functionEditorContent = tab.content;
                functionEditorFunctionName = tab.fileName || '';
            }
        }

        function activateFileTab(tabId, options) {
            if (!tabId) return;
            if (activeFileTabId === tabId && !options?.force) {
                refreshTabVisualState();
                return;
            }
            const targetTab = openFileTabs.get(tabId);
            if (!targetTab) {
                return;
            }
            persistActiveTabContent();
            activeFileTabId = tabId;
            workspaceTabs.rememberActivation(targetTab);
            debugContext.rememberFromTab(targetTab);
            const functionTab = isFunctionTab(targetTab);
            if (targetTab.scope && !functionTab) {
                currentFileScope = targetTab.scope;
                currentFileBrowserScope = targetTab.scope;
                const scopeSelect = document.getElementById('fileScopeSelect');
                if (scopeSelect) {
                    scopeSelect.value = currentFileBrowserScope;
                }
            }
            if (functionTab) {
                currentFileScope = FUNCTION_LIBRARY_SCOPE;
                currentFileName = targetTab.fileName || targetTab.displayName || '';
            } else {
                currentFileName = targetTab.fileName || targetTab.displayName || '';
            }
            originalContent = targetTab.originalContent || '';
            isFileModified = !!targetTab.isDirty;
            if (targetTab.loaded) {
                if (editor) {
                    editor.setValue(targetTab.content || '');
                }
            } else if (targetTab.fileName && !functionTab) {
                if (editor) {
                    editor.setValue('// Loading ' + targetTab.fileName + '...');
                }
                loadFile(targetTab.fileName, { suppressTabActivation: true, targetTabId: targetTab.id });
            } else if (editor) {
                editor.setValue(targetTab.content || '');
            }
            if (functionTab) {
                functionEditorFunctionName = targetTab.fileName || '';
                functionEditorContent = targetTab.content || '';
                const fnSelect = document.getElementById('functionSelect');
                if (fnSelect) {
                    fnSelect.value = targetTab.fileName || '';
                }
            }
            refreshTabVisualState();
            updateSaveButtonStates();
            updateRunButtonState();
            updateReferencePane();
        }

        function requestTabClose(tabId) {
            const tab = openFileTabs.get(tabId);
            if (!tab) return;
            if (tab.isDirty) {
                const confirmed = confirm('Discard unsaved changes in ' + (tab.fileName || tab.displayName) + '?');
                if (!confirmed) {
                    return;
                }
            }
            closeFileTab(tabId);
        }

        function closeFileTab(tabId) {
            deleteTab(tabId);
            renderPrimaryTabs();
            if (!activeFileTabId && tabOrder.length > 0) {
                activateFileTab(tabOrder[tabOrder.length - 1], { force: true });
            } else if (tabOrder.length === 0 && editor) {
                editor.setValue('');
                currentFileName = '';
                originalContent = '';
                isFileModified = false;
                updateSaveButtonStates();
                updateRunButtonState();
            }
        }

        function closeAllTabs() {
            Array.from(openFileTabs.keys()).forEach(tabId => deleteTab(tabId));
            tabOrder = [];
            activeFileTabId = null;
            referenceTabId = null;
            workspaceTabs.reset();
            debugContext.remember('global', 'main.ch');
            renderPrimaryTabs();
            updateReferencePane();
            if (editor) {
                editor.setValue('');
            }
            currentFileName = '';
            originalContent = '';
            isFileModified = false;
        }

        function openFileFromListSelection(fileName) {
            if (!fileName) {
                return;
            }
            const scope = currentFileBrowserScope;
            let tabId = getTabIdForFile(scope, fileName);
            if (!tabId) {
                const tab = ensureTabForFile(scope, fileName, { loaded: false, activate: true });
                tabId = tab.id;
            } else {
                activateFileTab(tabId, { force: true });
            }
            loadFile(fileName, { suppressTabActivation: true, targetTabId: tabId, scope });
        }

        function ensureTabForFile(scope, fileName, options) {
            const opts = options || {};
            const existingId = getTabIdForFile(scope, fileName);
            let tab;
            if (existingId) {
                tab = openFileTabs.get(existingId);
            }
            if (!tab) {
                tab = createTabRecord({
                    scope,
                    fileName,
                    displayName: fileName,
                    content: opts.content || '',
                    originalContent: opts.originalContent || '',
                    loaded: opts.loaded !== false,
                    isDirty: false
                });
                tab.isFunctionTab = isFunctionScope(scope);
                registerTab(tab);
            } else {
                if (tab.pinnedInReference) {
                    if (referenceTabId === tab.id) {
                        referenceTabId = null;
                        updateReferencePane();
                    }
                    tab.pinnedInReference = false;
                    ensureTabOrder(tab.id);
                }
                if (typeof opts.content === 'string') {
                    tab.content = opts.content;
                }
                if (typeof opts.originalContent === 'string') {
                    tab.originalContent = opts.originalContent;
                }
                if (opts.loaded !== undefined) {
                    tab.loaded = opts.loaded;
                } else if (typeof opts.content === 'string') {
                    tab.loaded = true;
                }
                tab.displayName = fileName;
                tab.fileName = fileName;
                tab.scope = scope;
                tab.isUntitled = false;
                tab.isDirty = !!opts.isDirty;
                tab.isFunctionTab = isFunctionScope(scope);
                indexTabByFile(tab, scope, fileName);
            }
            workspaceTabs.rememberContent(tab);
            renderPrimaryTabs();
            if (opts.activate !== false) {
                activateFileTab(tab.id, { force: true });
            }
            return tab;
        }

        function ensureReferenceEditor() {
            if (referenceEditor || !monaco || !editorPaneState.secondary.bodyEl) {
                return;
            }
            referenceEditor = monaco.editor.create(editorPaneState.secondary.bodyEl, {
                value: '',
                language: 'chariot',
                theme: 'vs-dark',
                automaticLayout: true,
                fontSize: 13,
                minimap: { enabled: false },
                readOnly: true,
                wordWrap: 'on',
                scrollBeyondLastLine: false,
                renderLineHighlight: 'none'
            });
            guardEditorDropFromTabDrags(referenceEditor);
        }

        function renderReferenceTabStrip(tab) {
            ensurePaneElements();
            const strip = editorPaneState.secondary.tabStripEl;
            if (!strip) return;
            strip.innerHTML = '';
            if (!tab) {
                const hint = document.createElement('div');
                hint.className = 'pane-empty-state';
                hint.textContent = 'Drag a tab down here to pin a reference';
                strip.appendChild(hint);
                return;
            }
            const el = document.createElement('div');
            el.className = 'editor-tab active';
            el.textContent = tab.displayName || tab.fileName;
            const closeBtn = document.createElement('button');
            closeBtn.textContent = '×';
            closeBtn.title = 'Close reference';
            el.appendChild(closeBtn);
            closeBtn.addEventListener('click', (ev) => {
                ev.stopPropagation();
                unpinReferenceTab();
            });
            strip.appendChild(el);
        }

        function updateReferencePane() {
            ensurePaneElements();
            const pane = editorPaneState.secondary;
            const divider = document.getElementById('editorPaneDivider');
            if (!referenceTabId) {
                if (pane.paneEl) pane.paneEl.classList.remove('visible');
                if (divider) divider.classList.remove('visible');
                if (referenceEditor) referenceEditor.setValue('');
                renderReferenceTabStrip(null);
                splitViewActive = false;
                return;
            }
            const tab = openFileTabs.get(referenceTabId);
            if (!tab) {
                referenceTabId = null;
                updateReferencePane();
                return;
            }
            ensureReferenceEditor();
            if (pane.paneEl) pane.paneEl.classList.add('visible');
            if (divider) divider.classList.add('visible');
            splitViewActive = true;
            if (referenceEditor) {
                referenceEditor.setValue(tab.content || '');
            }
            renderReferenceTabStrip(tab);
        }

        function restoreTabToPrimary(tabId, options) {
            const tab = openFileTabs.get(tabId);
            if (!tab) {
                return;
            }
            tab.pinnedInReference = false;
            ensureTabOrder(tabId);
            renderPrimaryTabs();
            if (options?.activate) {
                activateFileTab(tabId, { force: true });
            } else {
                refreshTabVisualState();
            }
        }

        function pinTabInReference(tabId) {
            if (!tabId) return;
            const tab = openFileTabs.get(tabId);
            if (!tab) return;
            persistActiveTabContent();
            if (referenceTabId && referenceTabId !== tabId) {
                const previousReference = referenceTabId;
                referenceTabId = null;
                restoreTabToPrimary(previousReference, { activate: false });
            }
            const wasActive = activeFileTabId === tabId;
            tabOrder = tabOrder.filter(id => id !== tabId);
            tab.pinnedInReference = true;
            referenceTabId = tabId;
            renderPrimaryTabs();
            if (wasActive) {
                activeFileTabId = null;
                if (tabOrder.length > 0) {
                    activateFileTab(tabOrder[tabOrder.length - 1], { force: true });
                } else if (editor) {
                    editor.setValue('');
                    currentFileName = '';
                    originalContent = '';
                    isFileModified = false;
                    updateSaveButtonStates();
                    updateRunButtonState();
                }
            } else {
                refreshTabVisualState();
            }
            updateReferencePane();
        }

        function unpinReferenceTab() {
            if (!referenceTabId) {
                return;
            }
            const tabId = referenceTabId;
            referenceTabId = null;
            restoreTabToPrimary(tabId, { activate: tabOrder.length === 0 });
            updateReferencePane();
        }

        function handleTabDragStart(ev, tabId) {
            tabDragState = { tabId };
            if (ev.dataTransfer) {
                ev.dataTransfer.effectAllowed = 'copy';
                ev.dataTransfer.setData('text/plain', '');
            }
            const hint = document.getElementById('editorSplitDropHint');
            if (hint) hint.style.display = 'flex';
        }

        function handleTabDragEnd() {
            tabDragState = { tabId: null };
            const hint = document.getElementById('editorSplitDropHint');
            if (hint) hint.style.display = 'none';
        }

        function handleWorkspaceDragOver(ev) {
            if (!tabDragState.tabId) return;
            ev.preventDefault();
        }

        function handleWorkspaceDrop(ev) {
            if (!tabDragState.tabId) return;
            ev.preventDefault();
            const workspace = document.getElementById('editorWorkspace');
            const hint = document.getElementById('editorSplitDropHint');
            if (hint) hint.style.display = 'none';
            if (!workspace) {
                tabDragState = { tabId: null };
                return;
            }
            const rect = workspace.getBoundingClientRect();
            const relativeY = ev.clientY - rect.top;
            if (relativeY > rect.height * 0.6) {
                pinTabInReference(tabDragState.tabId);
            } else {
                activateFileTab(tabDragState.tabId, { force: true });
            }
            tabDragState = { tabId: null };
        }

        function guardEditorDropFromTabDrags(editorInstance) {
            if (!editorInstance || typeof editorInstance.getDomNode !== 'function') {
                return;
            }
            const node = editorInstance.getDomNode();
            if (!node) return;

            const alreadyGuarded = node.dataset
                ? node.dataset.tabDragGuarded === 'true'
                : node.getAttribute('data-tab-drag-guarded') === 'true';
            if (alreadyGuarded) {
                return;
            }

            const suppressTabDragDrop = (ev) => {
                if (tabDragState.tabId) {
                    ev.preventDefault();
                }
            };

            node.addEventListener('dragover', suppressTabDragDrop);
            node.addEventListener('drop', suppressTabDragDrop);

            if (node.dataset) {
                node.dataset.tabDragGuarded = 'true';
            } else {
                node.setAttribute('data-tab-drag-guarded', 'true');
            }
        }
        // Session management variables
        let sessionTimer = null;
        let warningTimer = null;
        let logoutTimer = null;
        let sessionWarningShown = false;

        function getNormalizedScope(scope) {
            const raw = (scope || '').trim().toLowerCase();
            return raw || 'global';
        }

        function getDebuggerFilename(options) {
            const opts = options || {};
            if (opts.scope || opts.fileName) {
                return debugContext.getFilename(opts);
            }
            const activeTab = activeFileTabId ? openFileTabs.get(activeFileTabId) : null;
            if (activeTab) {
                debugContext.rememberFromTab(activeTab);
            } else if (currentTab === 'functions' && functionEditorFunctionName) {
                debugContext.remember(FUNCTION_LIBRARY_SCOPE, functionEditorFunctionName);
            } else if (currentFileName) {
                debugContext.remember(currentFileScope || currentFileBrowserScope, currentFileName);
            }
            return debugContext.getFilename();
        }

        function splitDebuggerFilename(raw) {
            if (!raw) {
                return { scope: 'global', file: '' };
            }
            const normalized = raw.trim();
            const slashIndex = normalized.indexOf('/');
            if (slashIndex === -1) {
                return { scope: 'global', file: normalized };
            }
            return {
                scope: normalized.slice(0, slashIndex) || 'global',
                file: normalized.slice(slashIndex + 1)
            };
        }

        function formatDebuggerFileLabel(raw, fallbackScope) {
            const target = raw && raw.trim() ? raw.trim() : '';
            const parsed = target ? splitDebuggerFilename(target) : {
                scope: getNormalizedScope(fallbackScope),
                file: ''
            };
            const scopeLabel = getScopeLabel(parsed.scope);
            if (!parsed.file) {
                return parsed.scope === 'global' ? 'main.ch' : (scopeLabel + ' / main.ch');
            }
            if (parsed.scope === 'global' || parsed.scope === '') {
                return parsed.file;
            }
            return scopeLabel + ' / ' + parsed.file;
        }

        // Toggle between runtime inspection and debugger panels
        function showDebuggerPanel() {
            const runtimePanel = document.getElementById('runtimePanel');
            const debuggerPanel = document.getElementById('debuggerPanel');
            if (runtimePanel && debuggerPanel) {
                runtimePanel.style.display = 'none';
                debuggerPanel.style.display = 'block';
            } else {
                console.error('Panels not found:', { runtimePanel: !!runtimePanel, debuggerPanel: !!debuggerPanel });
            }
        }

        function showRuntimePanel() {
            const runtimePanel = document.getElementById('runtimePanel');
            const debuggerPanel = document.getElementById('debuggerPanel');
            if (runtimePanel && debuggerPanel) {
                runtimePanel.style.display = 'block';
                debuggerPanel.style.display = 'none';
            } else {
                console.error('Panels not found:', { runtimePanel: !!runtimePanel, debuggerPanel: !!debuggerPanel });
            }
        }

        // Debugger state
        let debugSocket = null;
        let debugState = 'stopped'; // stopped, running, paused, stepping
        let breakpoints = new Map(); // line number -> { line, enabled }
        let currentDebugLine = null;
        let currentDebugFile = null;
        let debugDecorations = [];
        let isExecuting = false; // Flag to prevent runtime inspection during execution
        let debuggerSessionReady = false;
        let debugSocketReconnectTimer = null;
        let debugSocketShouldReconnect = false;
        const DEBUG_SOCKET_RETRY_MS = 2000;
        const DEBUG_SOCKET_READY_TIMEOUT_MS = 5000;
        let debugSocketReadyResolvers = [];

        // Toggle debug section collapse
        function toggleDebugSection(header) {
            const content = header.nextElementSibling;
            header.classList.toggle('collapsed');
            content.classList.toggle('collapsed');
        }

        function expandDebugSection(contentId) {
            const content = document.getElementById(contentId);
            if (!content) return;
            const header = content.previousElementSibling;
            if (header) {
                header.classList.remove('collapsed');
            }
            content.classList.remove('collapsed');
        }

        function ensureDebuggerDetailsVisible() {
            expandDebugSection('callStackContent');
            expandDebugSection('variablesContent');
        }

        // Update debug status UI
        function updateDebugStatus(state, text) {
            debugState = state;
            const icon = document.getElementById('debugStatusIcon');
            const statusText = document.getElementById('debugStatusText');

            icon.className = 'debug-status-icon ' + state;
            statusText.textContent = text || state.charAt(0).toUpperCase() + state.slice(1);

            // Update button states
            const continueBtn = document.getElementById('debugContinue');
            const pauseBtn = document.getElementById('debugPause');
            const stepOverBtn = document.getElementById('debugStepOver');
            const stepIntoBtn = document.getElementById('debugStepInto');
            const stepOutBtn = document.getElementById('debugStepOut');

            if (state === 'paused' || state === 'stepping') {
                continueBtn.disabled = false;
                pauseBtn.disabled = true;
                stepOverBtn.disabled = false;
                stepIntoBtn.disabled = false;
                stepOutBtn.disabled = false;
            } else if (state === 'running') {
                continueBtn.disabled = true;
                pauseBtn.disabled = false;
                stepOverBtn.disabled = true;
                stepIntoBtn.disabled = true;
                stepOutBtn.disabled = true;
            } else {
                continueBtn.disabled = true;
                pauseBtn.disabled = true;
                stepOverBtn.disabled = true;
                stepIntoBtn.disabled = true;
                stepOutBtn.disabled = true;
            }
        }

        // Render breakpoints list
        function renderBreakpoints() {
            const container = document.getElementById('breakpointsContent');
            if (!container) return; // Element doesn't exist yet

            if (breakpoints.size === 0) {
                container.innerHTML = '<div style="padding: 8px; color: #888; font-size: 11px;">No breakpoints set. Click on a line number to add one.</div>';
                return;

            let html = '';
            const fileLabel = formatDebuggerFileLabel(getDebuggerFilename(), currentFileScope);
            breakpoints.forEach((bp, lineNum) => {
                html += `
+                    <div class="breakpoint-item" data-line="${lineNum}">
+                        <div>
+                            <div class="breakpoint-location">${fileLabel}</div>
+                            <div class="breakpoint-line">Line ${lineNum}</div>
+                        </div>
+                        <span class="breakpoint-remove" onclick="removeBreakpoint(${lineNum})">✖</span>
+                    </div>

            });

        // Render call stack

                return;
            }

            let html = '';
            stack.forEach((frame, index) => {
                html += `
                    <div class="callstack-item">
                        <div class="callstack-function">${frame.functionName || 'anonymous'}</div>
                        <div class="callstack-location">${formatDebuggerFileLabel(frame.file, currentFileScope)}:${frame.line}</div>

        // Render variables
